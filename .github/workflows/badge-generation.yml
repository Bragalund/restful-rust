name: Test Coverage Badges

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  coverage-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache cargo build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        run: cargo tarpaulin --out Json --workspace --timeout 120

      - name: Extract coverage value
        id: coverage
        run: |
          python - <<'PY'
          import json, os
          with open('tarpaulin-report.json', 'r', encoding='utf-8') as f:
              report = json.load(f)
          coverage = report.get('coverage', 0.0)
          formatted = f"{coverage:.2f}%"
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"coverage={formatted}\n")
          PY

      - name: Generate coverage badge
        uses: emibcn/badge-action@v2
        with:
          label: coverage
          status: ${{ steps.coverage.outputs.coverage }}
          color: blue
          path: coverage-badge.svg

      - name: Generate build status badge
        if: ${{ success() }}
        uses: emibcn/badge-action@v2
        with:
          label: build
          status: passing
          color: brightgreen
          path: build-status-badge.svg

      - name: Upload badge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-badges
          path: |
            coverage-badge.svg
            build-status-badge.svg
