name: Generate Diagram

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  repo-visualizer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Visualize repository
        uses: githubocto/repo-visualizer@v0.9.0
        with:
          output_file: diagram.svg
          branch: main
          excluded_paths: |
            target
            fuzz/target
