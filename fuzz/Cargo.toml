[package]
name = "restful-rust-fuzz"
version = "0.0.0"
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "0.2.9", features = ["macros"] }
warp = "0.2.0"
chrono = { version = "0.4.10", features = ["serde"] }

[dependencies.restful-rust]
path = ".."

[[bin]]
name = "fuzz_target_1"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false
